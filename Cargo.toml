[workspace]
resolver = "3"
members = ["crates/baz-core", "crates/baz"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/mattcree/baz"
authors = ["baz contributors"]

[workspace.dependencies]
baz-core = { path = "crates/baz-core", version = "0.0.0" }
dirs = "6"          # XDG config/data dir lookup for config + library DB (MIT OR Apache-2.0)
# GUI toolkit (ADR-0005, chosen by the Spike A head-to-head). Pure Rust, zero
# system deps on Linux. `image` for album-art widgets; `tokio` supplies the
# executor that drives subscriptions and the blocking-decode pool. (MIT)
iced = { version = "0.13", features = ["image", "tokio"] }
# Thumbnail decode + downscale; jpeg/png only — the two formats cover art
# ships in practice (see crates/baz/src/art.rs). (MIT OR Apache-2.0)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"      # tag reading (MIT OR Apache-2.0)
# Bounded album-art thumbnail cache (MIT). >= 0.16.3 for the RUSTSEC-2026-0002
# IterMut soundness fix; iced_glyphon still pins a 0.12 copy (see deny.toml).
lru = "0.16.3"
memchr = "2"        # SIMD substring scan for the search hot path (Unlicense OR MIT)
# Durable library store (MIT; libsqlite3-sys MIT, SQLite itself public
# domain). `bundled` compiles SQLite from source so no system library or
# -dev package is needed on any platform.
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"     # library error types (MIT OR Apache-2.0)
walkdir = "2"       # directory traversal (Unlicense OR MIT)
# Playback engine (ADR-0003/ADR-0004; architecture proven in Spike B):
# `mp3` enables symphonia-bundle-mp3 (MPL-2.0, same as the rest of
# symphonia); gapless trim for it is verified in crates/baz-core/tests.
# AAC stays off — see baz_core::playback::source docs for why.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3"] }  # demux/decode (MPL-2.0 — allowlisted in deny.toml)
tokio = { version = "1", features = ["rt"] }  # async runtime for the iced shell only (MIT)
rtrb = "0.3"        # lock-free SPSC ring buffer, no hand-rolled unsafe here (MIT OR Apache-2.0)
rubato = "0.16"     # windowed-sinc sample-rate conversion (MIT)
cpal = "0.16"       # shared-mode device output, optional feature `device-output` (Apache-2.0)

# dev-dependencies
criterion = "0.8"   # benchmarks per docs/ENGINEERING.md (MIT OR Apache-2.0)
hound = "3.5"       # WAV fixture generation in tests (Apache-2.0)
tempfile = "3"      # scratch dirs for scanner tests (MIT OR Apache-2.0)

# Lint policy (see docs/ENGINEERING.md): clippy::all + selectively-audited
# pedantic lints. CI runs with -D warnings, so "warn" here is enforced there.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"          # exclusive-mode audio backends will opt out explicitly

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Audited exceptions to pedantic (rationale required to extend this list):
module_name_repetitions = "allow"   # baz_core::protocol::Command is fine
must_use_candidate = "allow"        # too noisy; #[must_use] applied deliberately
missing_errors_doc = "warn"
unwrap_used = "warn"                # library code must not unwrap (tests may)

[profile.release]
lto = "thin"
