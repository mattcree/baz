[workspace]
resolver = "3"
members = ["crates/baz-core", "crates/baz"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/mattcree/baz"
authors = ["baz contributors"]

[workspace.dependencies]
baz-core = { path = "crates/baz-core", version = "0.1.0" }
dirs = "6"          # XDG config/data dir lookup for config + library DB (MIT OR Apache-2.0)
# GUI toolkit (ADR-0005, chosen by the Spike A head-to-head). Pure Rust, zero
# system deps on Linux. `image` for album-art widgets; `tokio` supplies the
# executor that drives subscriptions and the blocking-decode pool;
# `advanced` exposes the `Widget` trait, which the seek groove implements
# because neither `slider` nor `mouse_area` can express its pointer
# affordances (evidence in crates/baz/src/seek.rs). All three are feature
# flags on a dependency already here — no new crates. (MIT)
iced = { version = "0.13", features = ["advanced", "image", "tokio"] }
ab_glyph = "0.2.32" # rasterise cached generated jewel-case inserts (MIT OR Apache-2.0)
# Thumbnail decode + downscale; jpeg/png only — the two formats cover art
# ships in practice (see crates/baz/src/art.rs). (MIT OR Apache-2.0)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"      # tag reading (MIT OR Apache-2.0)
# Bounded album-art thumbnail cache (MIT). >= 0.16.3 for the RUSTSEC-2026-0002
# IterMut soundness fix; iced_glyphon still pins a 0.12 copy (see deny.toml).
lru = "0.16.3"
# WGPU's own shader parser, named directly only in tests so an invalid jewel-
# case WGSL module fails before the Now Playing view constructs it. Already in
# the release graph through wgpu; this adds no crate or shipped code. (MIT OR Apache-2.0)
naga = { version = "0.19.2", features = ["wgsl-in"] }
memchr = "2"        # SIMD substring scan for the search hot path (Unlicense OR MIT)
# Durable library store (MIT; libsqlite3-sys MIT, SQLite itself public
# domain). `bundled` compiles SQLite from source so no system library or
# -dev package is needed on any platform.
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"     # library error types (MIT OR Apache-2.0)
walkdir = "2"       # directory traversal (Unlicense OR MIT)
# Playback engine (ADR-0003/ADR-0004; architecture proven in Spike B).
# Every sub-crate is MPL-2.0, same as symphonia itself. No feature here pulls
# a C library or a system dependency: the whole decode path is pure Rust, and
# staying that way is a build-system property worth keeping (see the Opus note
# in docs/BACKLOG.md).
#
# The feature set is chosen to match `AUDIO_EXTENSIONS` exactly — the shelf
# must never advertise a track the engine cannot play, and
# `every_advertised_extension_decodes` in tests/playback.rs asserts the
# correspondence rather than trusting this comment:
#   wav + pcm         -> .wav
#   flac              -> .flac (and FLAC-in-Ogg, via `ogg`)
#   mp3               -> .mp3
#   isomp4 + aac+alac -> .m4a / .mp4
#   ogg + vorbis      -> .ogg
# Symphonia 0.5 has no Opus decoder at all (its `symphonia-codec-opus` crate
# is an empty placeholder and is unpublished; 0.6.0 still ships none), so
# `.opus` is deliberately absent from AUDIO_EXTENSIONS instead of being
# listed and then skipped. Per-format gapless status — including what MP4
# does not trim and what a Vorbis seek costs — is documented, and tested, in
# baz_core::playback.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "flac", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis"] }  # demux/decode (MPL-2.0 — allowlisted in deny.toml)
# Already in the graph as symphonia's own dependency — **zero net-new crates**,
# and named here only so that `playback::source` can register the ID3v2 reader
# on a probe of its own. It builds that probe rather than calling
# `symphonia::default::get_probe()` because the default registry includes the
# raw-ADTS demuxer, which baz never wants: `.aac` is not an `AUDIO_EXTENSIONS`
# member, so in production that reader only ever fires on a file that is not
# what its name says — and it is where every panic the fuzz sweep found lived
# (ADR-0040 §2.5). Version must track `symphonia` above; Cargo.lock unifies
# them.
symphonia-metadata = { version = "0.5", default-features = false }  # ID3v2 reader for baz's own probe (MPL-2.0)
tokio = { version = "1", features = ["rt"] }  # async runtime for the iced shell only (MIT)
# Playlist deletion moves the file to the platform trash instead of unlinking
# it (doc 11 §5 P2 — forgiveness: reversible-first, the confirm dialog
# retired). Freedesktop trash spec on Linux, Recycle Bin / Finder Trash
# elsewhere. (MIT OR Apache-2.0.) Priced like `rfd` was in ADR-0025: on Linux
# it adds chrono + urlencoding + scopeguard to the compiled graph; the rest of
# the lock growth is Windows/macOS target-gated. `cargo deny check` green —
# the pricing is recorded in ADR-0027.
trash = "5.2.6"
# `config.toml` (MIT OR Apache-2.0). Adopted when ReplayGain's persisted
# setting took the configuration from one key to five — the switch `config.rs`
# and `docs/BACKLOG.md` both named as the plan of record for exactly that
# growth. Measured cost: three crates (`toml`, `serde_spanned`, `toml_writer`);
# the parser (`toml_parser`, `toml_datetime`, `winnow`) and `serde` were
# already in the lock through zbus's macros. `preserve_order` is deliberately
# off — the document is assembled with its comments rather than serialized, so
# key order is ours already, and it would pull `indexmap` in for nothing.
toml = { version = "1.1.4", default-features = false, features = ["parse", "display", "serde", "std"] }
# D-Bus for MPRIS2 desktop integration on Linux (MIT). Pure Rust — no C, no
# system library, no pkg-config — so the Linux build stays system-dep-free.
# Deliberately major 4 rather than the current 5: zbus 4.4 is *already* linked
# into every Linux baz binary (iced_core -> dark-light asks the desktop portal
# for the system theme over D-Bus), so depending on it directly adds zero new
# crates and no duplicate D-Bus stack. Move to 5 when iced's transitive copy
# does. Rationale in full: crates/baz/src/mpris/mod.rs.
zbus = "4.4"
# Native directory picker (MIT). On Linux the `xdg-portal` backend speaks the
# desktop portal over D-Bus — the same mechanism a Flatpak would be forced to
# use, and the GNOME/KDE-native dialog for free — with **no** gtk-sys and no
# async-runtime coupling: rfd 0.17 dropped ashpd, so the portal call is its own
# small D-Bus client driven by `pollster::block_on`. The `gtk3` fallback
# feature stays off deliberately. See ADR-0023 for the graph audit.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rtrb = "0.3"        # lock-free SPSC ring buffer, no hand-rolled unsafe here (MIT OR Apache-2.0)
rubato = "0.16"     # windowed-sinc sample-rate conversion (MIT)
cpal = "0.16"       # shared-mode device output, optional feature `device-output` (Apache-2.0)
# Exclusive-mode output on Linux (ADR-0012), optional feature
# `exclusive-output`. Not a new build requirement: this exact version is
# **already** in `Cargo.lock` as an indirect dependency of cpal's ALSA host,
# and `alsa-sys` already links `libasound` for every `device-output` build. So
# the cost is a dependency *line* and a `cfg(target_os = "linux")` module, as
# ADR-0011's costing table said it would be. (MIT)
alsa = "0.9.1"

# dev-dependencies
criterion = "0.8"   # benchmarks per docs/ENGINEERING.md (MIT OR Apache-2.0)
hound = "3.5"       # WAV fixture generation in tests (Apache-2.0)
tempfile = "3"      # scratch dirs for scanner tests (MIT OR Apache-2.0)

# Lint policy (see docs/ENGINEERING.md): clippy::all + selectively-audited
# pedantic lints. CI runs with -D warnings, so "warn" here is enforced there.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"          # exclusive-mode audio backends will opt out explicitly

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Audited exceptions to pedantic (rationale required to extend this list):
module_name_repetitions = "allow"   # baz_core::protocol::Command is fine
must_use_candidate = "allow"        # too noisy; #[must_use] applied deliberately
missing_errors_doc = "warn"
unwrap_used = "warn"                # library code must not unwrap (tests may)

[profile.release]
lto = "thin"
