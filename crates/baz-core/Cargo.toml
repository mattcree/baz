[package]
name = "baz-core"
description = "Headless engine for the baz music player: playback, library, and the command/event protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cpal = { workspace = true, optional = true }
lofty = { workspace = true }
memchr = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
symphonia = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }

[features]
# Real audio-device output via cpal. Non-default: building cpal requires
# platform audio headers (alsa-lib-devel on Linux), which the primary dev
# machine lacks outside the baz-dev toolbox. Everything else — including the
# whole playback test suite — runs headless against `OfflineSink`.
device-output = ["dep:cpal"]

[dev-dependencies]
criterion = { workspace = true }
hound = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "search"
harness = false

[[bench]]
name = "scan"
harness = false
