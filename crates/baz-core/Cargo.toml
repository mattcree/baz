[package]
name = "baz-core"
description = "Headless engine for the baz music player: playback, library, and the command/event protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cpal = { workspace = true, optional = true }
# XDG data-dir lookup for the play-history ledger, which lives beside the
# library database (ADR-0018). Adds **no crate to the workspace lock**: `dirs`
# is already there and already linked into every baz binary through
# `crates/baz`, so this is a dependency *line*, the same cost `alsa` was in
# ADR-0012. (`fuzz/Cargo.lock` is a separate lock that never saw `crates/baz`,
# so it does grow — by `dirs` and its four transitive crates. No fuzz target
# links them; they are graph, not binary.) The alternative — spelling the XDG
# spec out with `std::env` — would have been right on Linux and wrong on
# Windows and macOS, where the answer is not `$HOME/.local/share`.
dirs = { workspace = true }
lofty = { workspace = true }
memchr = { workspace = true }
rtrb = { workspace = true }
rubato = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
symphonia = { workspace = true }
thiserror = { workspace = true }
# The platform trash, for playlist deletion only (doc 11 §5 P2): the file a
# listener deletes is recoverable by the desktop's own means, which is what
# lets the confirm dialog retire. Lives here because `playlist::Folder` is
# the storage layer — the GUI never touches the filesystem itself.
trash = { workspace = true }
walkdir = { workspace = true }

# Exclusive-mode output (ADR-0012) is ALSA, and ALSA is Linux. The dependency
# is target-scoped so that a Windows or macOS build with the feature enabled
# still compiles — it simply has no exclusive backend to offer, and
# `OutputMode::Exclusive` reports that rather than pretending.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = { workspace = true, optional = true }

[features]
# Real audio-device output via cpal. Non-default: building cpal requires
# platform audio headers (alsa-lib-devel on Linux), which the primary dev
# machine lacks outside the baz-dev toolbox. Everything else — including the
# whole playback test suite — runs headless against `OfflineSink`.
device-output = ["dep:cpal"]
# Exclusive-mode output: baz holds an ALSA `hw:` device itself, so no system
# mixer sits between the decoder and the converter (ADR-0012). Implies
# `device-output` because it is a second backend behind the same engine spawn,
# not a separate one; needs the same `alsa-lib-devel` headers cpal already
# needs, so it adds no build requirement to a `device-output` build.
exclusive-output = ["device-output", "dep:alsa"]

[dev-dependencies]
criterion = { workspace = true }
hound = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "search"
harness = false

[[bench]]
name = "scan"
harness = false
