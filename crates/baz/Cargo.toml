[package]
name = "baz"
description = "baz — a fast, open-source music player for people who own their music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
baz-core = { workspace = true }
dirs = { workspace = true }
iced = { workspace = true }
image = { workspace = true }
lofty = { workspace = true }
lru = { workspace = true }
tokio = { workspace = true }

# MPRIS2 lives and dies with the freedesktop session bus, so the dependency is
# scoped to the platform that has one: Windows and macOS never see zbus in
# their dependency graph, let alone their binaries (see src/mpris/mod.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[features]
# Real audio-device output, forwarded to `baz-core/device-output`. Non-default
# for the same reason as there: building cpal needs platform audio headers
# (alsa-lib-devel), present in the baz-dev toolbox but not on the primary dev
# host. Without it the app builds and runs everywhere with playback UI hidden
# (see src/playback.rs).
device-output = ["baz-core/device-output"]

[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
