[package]
name = "baz"
description = "baz — a fast, open-source music player for people who own their music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ab_glyph = { workspace = true }
baz-core = { workspace = true, features = ["device-output"] }
dirs = { workspace = true }
iced = { workspace = true }
image = { workspace = true }
lofty = { workspace = true }
lru = { workspace = true }
rfd = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

# MPRIS2 lives and dies with the freedesktop session bus, so the dependency is
# scoped to the platform that has one: Windows and macOS never see zbus in
# their dependency graph, let alone their binaries (see src/mpris/mod.rs).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[features]
# Compatibility spelling for existing build scripts. Device output is now an
# unconditional property of the GUI binary; this feature no longer changes
# the graph, and `--no-default-features` cannot produce a silent GUI build.
device-output = []

[dev-dependencies]
hound = { workspace = true }
naga = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[lints]
workspace = true
