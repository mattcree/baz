# Proper nouns clippy::doc_markdown should not demand backticks for.
# ".." keeps clippy's built-in default list (OpenGL, GitHub, ...).
# `HarfBuzz` is the shaper the design system's own type measurements were
# taken through (`.interface-design/system.md` §8), so it is named wherever a
# measurement is justified against them.
doc-valid-idents = ["AppStream", "SQLite", "ReplayGain", "PipeWire", "ID3v2", "HarfBuzz", ".."]

# `unwrap_used` / `expect_used` are library-code rules (docs/ENGINEERING.md).
# A test asserting an invariant is the one place a panic is the right answer.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
