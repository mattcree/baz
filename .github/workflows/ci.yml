name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: fuzz + fresh advisory sweep
  workflow_dispatch:
    inputs:
      run_fuzz:
        description: Run the six five-minute discovery fuzz targets
        required: false
        type: boolean
        default: true
  # Callable so the release workflow can make this whole suite a hard
  # dependency of shipping a binary (.github/workflows/release.yml). The
  # release gate is *this* definition of green, not a copy of it.
  workflow_call:
    inputs:
      run_fuzz:
        description: Include discovery fuzzing in the caller's gate
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: python3 -m unittest discover -s tools/vibe-eval -p 'test_*.py'

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --all-features pulls cpal (feature device-output), which needs ALSA
      # headers on Linux; macOS/Windows audio backends need nothing extra.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features
      # Keep the promised player-only build honest: this must compile without
      # baz-vibe or bliss-audio in baz's dependency graph.
      - run: cargo check -p baz --no-default-features

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Vibe's full-build tests exercise the bundled tokenizer and model
      # artifacts, which are tracked with Git LFS rather than as pointer text.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install ALSA headers (cpal via --all-features)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast: cargo stops at the first failing test binary, so a
      # crashing suite can hide failures in every suite that sorts after it
      # (an access violation in `engine` masked broken `index` tests for
      # several merges). A green tick must mean every suite passed.
      - run: cargo test --workspace --all-features --no-fail-fast

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read MSRV from workspace
        id: msrv
        run: echo "msrv=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.msrv }} --profile minimal && rustup override set ${{ steps.msrv.outputs.msrv }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      # The workspace coverage pass runs baz-vibe tests, so it needs the real
      # tokenizer/model files rather than Git LFS pointer files.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The 80% line floor gates baz-core (engine + library — where coverage
      # is a meaningful promise). GUI view code needs a display to execute, so
      # the workspace-wide number is reported in the HTML artifact, not gated.
      - run: cargo llvm-cov -p baz-core --all-features --summary-only --fail-under-lines 80
      - run: cargo llvm-cov --workspace --all-features --summary-only
      - name: Full report artifact
        run: cargo llvm-cov report --html --output-dir coverage-html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html

  packaging:
    name: packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # desktop-file-utils -> desktop-file-validate; appstream -> appstreamcli;
      # python3-yaml so the manifest parse below does not depend on whatever
      # the runner image happens to preinstall.
      - run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream python3-yaml
      - name: Desktop entry
        run: desktop-file-validate packaging/io.github.mattcree.baz.desktop
      # **The macOS bundle, built and checked on Linux**, which is the whole
      # reason `bundle.sh` uses no Apple-only tool: a bundle nobody can
      # inspect until a release runs is a bundle nobody reviews. This builds
      # one over a stand-in executable and runs the script's own structural
      # checks — the plist parses, its keys say what they must, and the icns
      # header describes the file it is in.
      - name: macOS app bundle assembles and validates
        run: |
          set -euo pipefail
          printf '#!/bin/sh\nexit 0\n' > /tmp/baz-stub
          chmod +x /tmp/baz-stub
          packaging/macos/bundle.sh /tmp/baz-stub 0.0.0-ci /tmp/bundle-check
          test -x /tmp/bundle-check/baz.app/Contents/MacOS/baz
          test -f /tmp/bundle-check/baz.app/Contents/Info.plist
          test -f "/tmp/bundle-check/baz.app/Contents/Resources/io.github.mattcree.baz.icns"
      # Offline, deliberately. The screenshot URLs point at `docs/screenshots/`
      # on `main`, so on a pull request they name a branch's files at a URL
      # that only resolves once the branch has landed — a fetching validator
      # would fail every PR that re-shot a frame. The networked check belongs
      # to the release, and docs/RELEASING.md schedules it there.
      - name: AppStream metainfo
        run: |
          appstreamcli validate --no-net \
            packaging/flatpak/io.github.mattcree.baz.metainfo.xml
      # The Flatpak manifest is YAML that flatpak-builder parses; catching a
      # syntax error here costs a second and catching it at submission costs a
      # round trip. (A full `flatpak-builder --show-deps` would need the
      # flatpak toolchain on the runner for no extra signal.)
      - name: Flatpak manifest parses
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" \
            packaging/flatpak/io.github.mattcree.baz.yml
      # A Flathub build is offline, so every crate is listed by URL and hash.
      # This is where that list is caught drifting from Cargo.lock.
      - name: Vendored crate list matches Cargo.lock
        run: python3 packaging/flatpak/check-cargo-sources.py
      # The three names that must never drift apart: the desktop entry's
      # basename, the AppStream component id, and the MPRIS DesktopEntry
      # constant the binary advertises (crates/baz/src/mpris/mod.rs).
      - name: Application id is one string everywhere
        run: |
          set -euo pipefail
          id=io.github.mattcree.baz
          test -f "packaging/$id.desktop"
          grep -qx "  <id>$id</id>" "packaging/flatpak/$id.metainfo.xml"
          grep -qx "id: $id" "packaging/flatpak/$id.yml"
          grep -qx "pub(crate) const DESKTOP_ENTRY: &str = \"$id\";" \
            crates/baz/src/mpris/mod.rs
          # macOS joined the family: the bundle's CFBundleIdentifier and the
          # icon it names are the same string, and `bundle.sh` substitutes
          # `@APP_ID@` from one literal so a drift here is a build failure
          # rather than a Mac quietly drawing the generic mark.
          grep -q "app_id=$id" packaging/macos/bundle.sh
          test -f "packaging/icons/$id.icns"
          echo "application id consistent: $id"

  fuzz:
    name: fuzz (scheduled/manual)
    # Discovery fuzzing is intentionally not part of an ordinary push, PR, or
    # release gate. Direct manual CI dispatches opt in by default; reusable
    # callers have to ask for it. The hostile inputs already found here live
    # in crates/baz-core/tests/hostile_media.rs, which every gate does run.
    if: github.event_name == 'schedule' || inputs.run_fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal && rustup override set nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-fuzz
      # Both limits are set on purpose, and the pair is the point (ADR-0040
      # §4): **residency is baz's, a reservation is symphonia's.**
      #
      # `-rss_limit_mb=2048` is the real guard and keeps libFuzzer's default:
      # memory the decode path actually *touches* is baz's business, and a
      # target that grows resident is a defect wherever it lives.
      #
      # `-malloc_limit_mb=6144` raises only the single-allocation trip wire,
      # above the largest reservation a 32-bit length field can name (4.28 GB).
      # Symphonia allocates metadata buffers from unchecked `u32` lengths in at
      # least four places across two containers; that bound is upstream's, baz
      # declines to shadow four container parsers to take it, and the
      # reservation is a lazy zero mapping that is never written — measured at
      # 3.4 MB of peak RSS for a request of 4,278,208,769 bytes, and confirmed
      # under this exact pair of flags on all three known inputs. Left at the
      # default this job is permanently red for one written-down condition, and
      # a permanently red job is a job nobody reads, which would cost the other
      # five targets their audience.
      #
      # Note it is not `-malloc_limit_mb=0`: zero means *"use rss_limit_mb"*,
      # not *"off"*.
      #
      # The reproducers are gated on `push` by
      # `crates/baz-core/tests/hostile_media.rs`, which is where a release
      # actually meets them.
      #
      # **Every target runs, even after one fails.** A `run:` block is
      # `bash -e`, so the first non-zero `cargo fuzz run` used to abort the
      # step and the targets after it were never exercised at all. That
      # mattered the moment one target became reliably red: `playback_decode`
      # reports panics inside Symphonia's own parsers (ADR-0040 §4 — a
      # contained panic is still a panic to libFuzzer, whose hook aborts before
      # `catch_unwind` runs), and hiding the other five behind it would cost
      # far more than it saves. The step still fails, with the list.
      - run: |
          failed=""
          for target in $(cargo fuzz list); do
            echo "::group::fuzz $target"
            cargo fuzz run "$target" -- \
              -max_total_time=300 -rss_limit_mb=2048 -malloc_limit_mb=6144 \
              || failed="$failed $target"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "fuzz targets with findings:$failed"
            exit 1
          fi
