name: Release

# Builds the binaries a person downloads, and nothing else decides whether
# they are fit to download: the `gate` job below *calls* the CI workflow, so a
# tag cannot produce an artifact that `cargo test`, `clippy`, `cargo-deny` or
# the packaging checks would have rejected. It is a `needs:` edge, not an
# ordering convention — there is no path from a tag to an upload that skips it.
#
# docs/RELEASING.md is the checklist for cutting one; docs/INSTALL.md is what
# the artifacts are for.

on:
  push:
    # v-prefixed semver, including pre-releases (v0.1.0-rc.1).
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Dry run: builds and checksums everything, publishes nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Reproducibility, as far as it is cheap (see "What is pinned" in
  # docs/RELEASING.md): no incremental artifacts in a release build, and the
  # runner's absolute build path kept out of the binary.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/baz

jobs:
  # ---------------------------------------------------------------------
  # Fails in seconds if the tag and the workspace disagree about what
  # version this is, before anything spends a runner-hour on a build.
  # ---------------------------------------------------------------------
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and cross-check the version
        id: resolve
        run: |
          set -euo pipefail
          # [workspace.package] version — the only line-initial `version = `
          # in the manifest (the dependency entries are inline tables).
          manifest="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "workspace version: $manifest"

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag v$tag does not match the workspace version $manifest." \
                   "Bump Cargo.toml (and Cargo.lock) in the release commit, then tag it." >&2
              exit 1
            fi
            version="$tag"
            publish=true
          else
            # A dry run is never mistaken for the real thing: the artifacts
            # carry the commit they came from.
            version="$manifest+dry.$(git rev-parse --short HEAD)"
            publish=false
          fi

          # 0.x is a pre-release by semver's own reading of it, and so is
          # anything carrying a -suffix.
          case "$version" in
            0.*|*-*) prerelease=true ;;
            *)       prerelease=false ;;
          esac

          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # The whole PR gate, run again against the tagged tree. Reusing the
  # workflow rather than copying its jobs is the point: there is one
  # definition of "green", and it cannot drift from what PRs are held to.
  #
  # Discovery fuzzing is not part of this gate. CI still runs it weekly and on
  # a direct manual CI dispatch; hostile inputs it has already found are
  # permanent cargo tests. Giving a dry run and a tag the same gate is what
  # lets the rehearsal reach and prove the artifact matrix.
  # ---------------------------------------------------------------------
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      run_fuzz: false
    permissions:
      contents: read

  build:
    name: build (${{ matrix.artifact }})
    needs: [version, gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: linux-x86_64
            os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
          - artifact: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # One download rather than two, because an ordinary person should
          # not have to know which Mac they own. Apple's own `lipo` combines
          # the two slices, and cross-building x86_64 from the arm64 runner
          # needs no extra linker — the Xcode toolchain targets both.
          - artifact: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            universal: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Same reason and same package as CI's test job: --features
      # device-output pulls cpal, which needs ALSA headers on Linux.
      - name: Install ALSA headers (cpal via device-output)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # rust-toolchain.toml pins the compiler (1.92.0); rustup honours it, so
      # the targets are added to that toolchain and not to a floating stable.
      - name: Add targets
        shell: bash
        run: |
          set -euo pipefail
          rustc --version --verbose
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
          done

      # No build cache here, unlike CI. A release binary is built from cold
      # every time: a cache is a second input to the build that nobody
      # inspects, and ten minutes of runner time per tag is not worth it.
      #
      # --locked: the committed Cargo.lock, byte for byte, or fail. A release
      # must be built from the dependency set CI proved, not from whatever
      # resolved on the day.
      #
      # The Baz release includes Vibe. State its required capability explicitly
      # rather than relying on Cargo defaults; `--no-default-features` is only
      # an internal dependency-boundary check and is never a release artifact.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target" \
                        -p baz --features device-output,vibe-analysis
          done

      - name: Stage the archive contents
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          stage="staging/baz-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "$stage"

          if [ "${{ matrix.universal || 'false' }}" = "true" ]; then
            slices=""
            for target in ${{ matrix.targets }}; do
              slices="$slices target/$target/release/baz"
            done
            # shellcheck disable=SC2086
            lipo -create -output "staging/baz-universal" $slices
            lipo -info "staging/baz-universal"
            # **A macOS application is a bundle, not a binary.** A bare Mach-O
            # cannot carry an icon, a name or a permission string, so what
            # shipped before this had nothing for Finder, the Dock, Launchpad
            # or Spotlight to draw but the generic application mark.
            #
            # The bundle script is plain `mkdir`/`cp`/`sed` and runs on any
            # Unix — no `iconutil`, no `plutil` — so what the runner produces
            # is exactly what a reviewer can produce and inspect on Linux.
            # **The shipping icon is Apple's tool's, not a hand-written
            # container.** The first bundle shipped one written by hand and
            # macOS drew the generic icon over it, so this refuses to build a
            # download that quietly fell back.
            command -v iconutil >/dev/null || {
              echo "iconutil is missing from the macOS runner" >&2
              exit 1
            }
            # And prove which path it took by reading what it says it did.
            #
            # This used to grep the icns for a leading `TOC ` chunk, on the
            # reasoning that `iconutil` always writes one and the fallback
            # writer does not — a proxy, and a wrong one: the first release to
            # actually run it failed with a 406 KB icon that `iconutil` had
            # just built. The chunk is optional and Apple's tool does not lead
            # with it. `bundle.sh` names the branch it took on the way past,
            # so the check can be the statement itself rather than a guess
            # about its output.
            packaging/macos/bundle.sh "staging/baz-universal" "${VERSION}" "$stage" \
              | tee bundle.log
            grep -q "built by iconutil" bundle.log || {
              echo "the bundle fell back to the committed icns — macOS would draw" \
                   "the generic icon over it" >&2
              exit 1
            }
            rm bundle.log
            rm "staging/baz-universal"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.targets }}/release/baz.exe" "$stage/baz.exe"
          else
            cp "target/${{ matrix.targets }}/release/baz" "$stage/baz"
          fi

          # The licence travels with the binary — GPL-3.0-or-later requires
          # it to, and ADR-0001 is why. The changelog and readme are there so
          # an unpacked archive can answer "what is this and what changed".
          cp LICENSE README.md CHANGELOG.md "$stage/"
          if [ "${{ matrix.universal || 'false' }}" != "true" ]; then
            mkdir -p "$stage/models/vibe"
            cp models/vibe/audio_model_quantized.onnx \
               models/vibe/text_model_quantized.onnx \
               models/vibe/tokenizer.json \
               models/vibe/LICENSE \
               models/vibe/MODEL_CARD.md \
               models/vibe/README.md \
               "$stage/models/vibe/"
          fi

          # Desktop integration files, for anyone installing the tarball by
          # hand rather than through Flatpak (docs/INSTALL.md says where).
          # The icons travel in the hicolor layout they are installed in, so
          # the install is a copy of a tree rather than eight named files, and
          # the desktop entry's bare `Icon=io.github.mattcree.baz` resolves.
          #
          # macOS is the exception: the bundle above already carries its own
          # icon and its own copy of the models, so a second loose set beside
          # it would be the same bytes twice in one download.
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/io.github.mattcree.baz.desktop "$stage/"
            cp packaging/flatpak/io.github.mattcree.baz.metainfo.xml "$stage/"
            cp -r packaging/icons/hicolor "$stage/icons"
            # **And the step that puts them where a desktop looks.** All of the
            # above shipped for a while with `docs/INSTALL.md` asking the
            # reader to make five `install -Dm644` copies themselves, which is
            # not an installed application — it is an application and a list of
            # chores. `install.sh` makes those copies and keeps a manifest;
            # `uninstall.sh` reads the manifest back.
            install -m755 packaging/linux/install.sh "$stage/install.sh"
            install -m755 packaging/linux/uninstall.sh "$stage/uninstall.sh"
          fi

          ls -l "$stage"

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="baz-${VERSION}-${{ matrix.artifact }}"
          # `COPYFILE_DISABLE` stops macOS `tar` writing an AppleDouble `._`
          # sidecar beside every file it archives. Harmless on Linux, and on
          # macOS the difference between an app bundle and an app bundle
          # littered with files Finder shows to anyone who extracts it
          # somewhere other than macOS.
          COPYFILE_DISABLE=1 tar -czf "dist/${name}.tar.gz" -C staging "$name"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # ${env:VERSION}, braced: PowerShell allows hyphens in variable
          # names, so $env:VERSION-windows would read as one name.
          $name = "baz-${env:VERSION}-${{ matrix.artifact }}"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"

      # ---------------------------------------------------------------
      # The installers (ADR-0043 §2). The archives above stay: they are what
      # a reviewer, a packager and a person on a platform we do not target
      # actually want. These are what an ordinary person wants.
      # ---------------------------------------------------------------
      - name: Installer (msi)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # Rendered from LICENSE rather than committed, so the licence the
          # installer shows cannot drift from the one the project has.
          python3 packaging/windows/license-rtf.py
          cargo install cargo-wix --locked --version ^0.3
          # `--nocapture` puts WiX's own diagnostics in the job log: a light
          # build failure here is a linker message from candle/light and
          # nothing else says which element it disliked.
          # A dispatch adds SemVer build metadata (for example
          # `0.4.0+dry.abcdef`), which describes the artifact but cannot be
          # represented by MSI's numeric ProductVersion.  It has no bearing
          # on version precedence, so use the release portion inside MSI.
          MSI_VERSION="${VERSION%%+*}"
          # `--no-build` deliberately preserves the target selected by the
          # matrix build above.  Tell cargo-wix where that cross-compiled
          # executable landed instead of its native `target/release` default.
          TARGET_BIN_DIR="target/x86_64-pc-windows-msvc/release"
          cargo wix --no-build --nocapture \
            --package baz \
            --profile release \
            --target-bin-dir "${TARGET_BIN_DIR}" \
            --install-version "${MSI_VERSION}" \
            --output "dist/baz-${VERSION}-windows-x86_64.msi" \
            --include packaging/windows/main.wxs
          ls -l dist

      - name: Installer (dmg)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          stage="staging/baz-${VERSION}-${{ matrix.artifact }}"
          ./packaging/macos/dmg.sh \
            "$stage/baz.app" \
            "dist/baz-${VERSION}-macos-universal.dmg" \
            "baz ${VERSION}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: baz-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # **The Flatpak bundle** (ADR-0043 §2) — the recommended way to install baz
  # on Linux, and the one route whose updates a listener never has to think
  # about again.
  #
  # It is its own job rather than a step in `build` because it needs a
  # container the other artifacts do not: `flatpak-builder`, the freedesktop
  # SDK, and the Rust extension, none of which belong on a runner that is
  # only cross-compiling. It also builds baz *itself* — the manifest compiles
  # from source inside the sandbox — so it shares nothing with the matrix
  # above and gains nothing from waiting on it.
  #
  # A single-file `.flatpak` is a working install on every distribution the
  # day it is published: `flatpak install ./baz.flatpak`. Flathub is the
  # destination and its review is a human step; this is what makes the wait
  # cost a listener nothing, and it is also the proof that the manifest we
  # submit builds.
  # ---------------------------------------------------------------------
  flatpak:
    name: build (flatpak)
    needs: [version, gate]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build the bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          id=io.github.mattcree.baz
          # A release tag's manifest intentionally names the last published
          # source.  For this build, replace only that source with the exact
          # checked-out ref that triggered the workflow: otherwise v0.4.0
          # would accidentally bundle v0.3.0.  The committed manifest remains
          # the canonical Flathub input and is pinned after publication.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packaging/flatpak/io.github.mattcree.baz.yml")
          manifest = path.read_text()
          start = manifest.index("      - type: git")
          end = manifest.index("      # Every crate", start)
          source = "\n".join(
              [
                  "      - type: dir",
                  "        path: ../..",
                  "        skip: [target, .git]",
                  "",
              ]
          )
          path.write_text(manifest[:start] + source + manifest[end:])
          PY
          # The image carries the Flatpak tooling but not a configured remote.
          # `--install-deps-from` names a remote; make that name real before
          # asking the builder to install the pinned SDK and Rust extension.
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo --install-deps-from=flathub \
            builddir "packaging/flatpak/$id.yml"
          mkdir -p dist
          flatpak build-bundle repo \
            "dist/baz-${VERSION}-linux-x86_64.flatpak" "$id"
          ls -l dist

      # **Prove the metadata a store will show is valid**, not merely that the
      # build succeeded. `appstreamcli validate` is what Flathub runs on
      # submission, so a failure here is a failure we would rather have in our
      # own CI than in a review queue.
      - name: Validate the AppStream metadata
        run: |
          set -euo pipefail
          appstreamcli validate --no-net --explain \
            packaging/flatpak/io.github.mattcree.baz.metainfo.xml

      - uses: actions/upload-artifact@v4
        with:
          name: baz-flatpak
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------
  # Checksums in one place, over the artifacts as they were actually
  # uploaded — one sha256sum implementation instead of three per-runner
  # ones that could disagree.
  # ---------------------------------------------------------------------
  publish:
    name: checksums and release
    needs: [version, build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      # Only this job writes anything, and only on a tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # The reusable CI gate also uploads its coverage report into this
          # workflow run. Only the three `baz-*` build artifacts belong in a
          # release; otherwise checksum generation sees coverage-html's
          # directory and tries to hash it as an archive.
          pattern: baz-*
          path: incoming
          merge-multiple: true

      - name: Checksums
        working-directory: incoming
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- * | tee SHA256SUMS
          # Prove the file we are about to publish describes the files we are
          # about to publish, rather than trusting that it was written right.
          grep -v ' SHA256SUMS$' SHA256SUMS | sha256sum --check --strict

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: incoming/SHA256SUMS
          if-no-files-found: error

      - name: Release notes preamble
        if: needs.version.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **baz $VERSION** — a public beta. Linux is the platform baz is developed
          and used on; the Windows and macOS binaries are built and tested by CI
          but have not been exercised by a human. The limitations we know about
          are on the
          [project page](https://github.com/mattcree/baz/blob/v$VERSION/README.md#known-limitations).
          See
          [\`docs/INSTALL.md\`](https://github.com/mattcree/baz/blob/v$VERSION/docs/INSTALL.md)
          for installation, and
          [\`CHANGELOG.md\`](https://github.com/mattcree/baz/blob/v$VERSION/CHANGELOG.md)
          for what changed.

          **Which file to take.** Everything below is the same build; they
          differ in what happens after you download them.

          | You are on | Take | Updates by |
          |---|---|---|
          | Linux | \`.flatpak\` — \`flatpak install ./baz-*.flatpak\` | your software centre, automatically |
          | Windows | \`.msi\` | installing the next one over it |
          | macOS | \`.dmg\`, then drag baz to Applications | replacing the app |
          | anything | \`.tar.gz\` / \`.zip\` — the plain binary | nothing; you come back here |

          The archives are still here and still supported: they are what a
          packager, a reviewer, or a person on a distribution we do not target
          actually wants.

          Verify a download against \`SHA256SUMS\`:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`

          Built from this tag by GitHub Actions with the toolchain pinned in
          \`rust-toolchain.toml\` and \`--locked\` against the committed
          \`Cargo.lock\`, with the \`device-output\` and \`vibe-analysis\`
          features enabled. No artifact here was built on a developer machine.
          EOF

      # A draft, deliberately: the maintainer publishes after looking at what
      # the machinery produced. ENGINEERING.md's "a human owns the trunk"
      # applies at least as much to the thing strangers download.
      - name: Draft the GitHub Release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft --verify-tag --generate-notes --notes-file notes.md --title "baz $TAG")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" incoming/*

      - name: Dry run summary
        if: needs.version.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run — nothing published"
            echo
            echo "Version: \`${{ needs.version.outputs.version }}\`"
            echo
            echo '```'
            cat incoming/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
