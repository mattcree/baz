# Baz has `--socket=pulseaudio`, but deliberately no raw `/dev/snd` access.
#
# CPAL opens ALSA's `default` PCM.  Without this explicit route, a Flatpak
# runtime can resolve `default` to a sandbox-local fallback that accepts frames
# as fast as the process produces them; the engine then reaches end-of-track
# immediately.  PulseAudio's compatibility socket is PipeWire on modern Linux
# desktops, so this is the sandboxed shared-output route.
pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
