[package]
name = "baz-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Explicitly its own workspace root (the main workspace `exclude`s this
# crate). Without this, cargo keeps walking up past the exclusion and can
# latch onto an unrelated ancestor manifest in nested checkouts (e.g. git
# worktrees created inside the repository directory).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
baz-core = { path = "../crates/baz-core" }

[[bin]]
name = "protocol_deserialize"
path = "fuzz_targets/protocol_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scanner_inference"
path = "fuzz_targets/scanner_inference.rs"
test = false
doc = false
bench = false

[[bin]]
name = "playback_decode"
path = "fuzz_targets/playback_decode.rs"
test = false
doc = false
bench = false
