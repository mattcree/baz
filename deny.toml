# cargo-deny policy (docs/ENGINEERING.md). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# GPL-3.0-compatible allowlist. Extending it is a reviewed decision.
allow = [
  "GPL-3.0-or-later",   # our own crates
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Rejected outright in ADR-0003 / research: proprietary or unsuitable audio deps.
deny = [
  { crate = "bass", reason = "proprietary license, rejected in docs/research/04-tech-stack.md" },
  { crate = "openssl-sys", reason = "prefer rustls; native TLS adds platform build pain for no benefit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
