# cargo-deny policy (docs/ENGINEERING.md). Run: cargo deny check
[graph]
all-features = true
# Audit the platforms baz ships on (the CI matrix: Linux, macOS, Windows).
# Without this, deny also walks wasm-only branches (e.g. iced_futures →
# wasm-timer → the unmaintained `instant`) that are never compiled into any
# baz artifact. Extend this list if a wasm/mobile target ever becomes real.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` (proc-macro, transitive via lofty) is archived by its author but
  # has no vulnerability and no drop-in replacement upstream has adopted yet.
  # Revisit when lofty migrates (tracked upstream); remove this when it does.
  "RUSTSEC-2024-0436",
  # iced 0.14's cosmic-text/fontdb and winit/sctk-adwaita paths retain
  # ttf-parser 0.25.1. It is unmaintained, not presently vulnerable, and no
  # compatible upstream release removes it. Baz's generated-jewel rasterizer
  # also uses ab_glyph, which reaches the same parser. Revisit with iced/fontdb.
  "RUSTSEC-2026-0192",
]
# RUSTSEC-2026-0253: cryoglyph (iced_wgpu 0.14) pins lru 0.16.4, while Baz's
# own cache is fixed at 0.18.2. cargo-deny currently considers the advisory
# satisfied when the fixed direct copy is present and reports no matching
# advisory to ignore. The affected path also requires a panicking key Drop plus
# catch_unwind, which iced's glyph keys do not provide. Revisit with cryoglyph.

[licenses]
version = 2
# GPL-3.0-compatible allowlist. Extending it is a reviewed decision.
#
# Note on the bundled typeface: `crates/baz/assets/fonts/` ships IBM Plex under
# OFL-1.1, and **`OFL-1.1` is deliberately absent from this list**. cargo-deny
# walks the Cargo dependency graph; a checked-in asset is not a crate, so it is
# outside this file's remit entirely and adding the licence here would imply a
# dependency that does not exist. The obligations OFL does impose — ship the
# licence text, do not rename a modified copy — are met and argued in
# `crates/baz/assets/fonts/README.md`, and the faces are unmodified upstream
# files with hashes recorded there.
allow = [
  "GPL-3.0-or-later",   # our own crates
  # `bliss-audio`, used only by the optional local sonic analyzer. Combining
  # it with Baz's GPL-3.0-or-later code selects GPLv3 for the full artifact;
  # the light build excludes this dependency entirely.
  "GPL-3.0-only",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",               # foldhash (transitive: rusqlite → hashlink → hashbrown)
  # Boost Software License: permissive, GPL-compatible per the FSF license
  # list. Transitive via iced → winit → window_clipboard → clipboard-win /
  # error-code (Windows clipboard support).
  "BSL-1.0",
  # Creative Commons Zero: public-domain dedication, GPL-compatible per the
  # FSF license list. Transitive via iced → wgpu → naga → hexf-parse.
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Rejected outright in ADR-0003 / research: proprietary or unsuitable audio deps.
deny = [
  { crate = "bass", reason = "proprietary license, rejected in docs/research/04-tech-stack.md" },
  { crate = "openssl-sys", reason = "prefer rustls; native TLS adds platform build pain for no benefit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
