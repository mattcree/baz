[workspace]
resolver = "2"
members = ["crates/shelf-index"]
# src-tauri is deliberately NOT a workspace member: it needs system deps
# (webkit2gtk4.1-devel, gtk3-devel) that may be missing. It has its own
# [workspace] table and depends on shelf-index by path.
exclude = ["src-tauri"]

[profile.release]
debug = false
