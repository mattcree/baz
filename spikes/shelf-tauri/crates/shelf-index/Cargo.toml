[package]
name = "shelf-index"
version = "0.1.0"
edition = "2021"
description = "baz Spike A (Tauri): 100k-track search index + deterministic dataset generator + benchmark. Builds with zero system deps."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the generator bins need these; the lib (and thus the tauri crate) stays lean.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rayon = { version = "1", optional = true }

[features]
gen = ["dep:image", "dep:rayon"]

[[bin]]
name = "gen-dataset"
path = "src/bin/gen_dataset.rs"
required-features = ["gen"]

[[bin]]
name = "gen-icons"
path = "src/bin/gen_icons.rs"
required-features = ["gen"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
