[package]
name = "shelf-tauri"
version = "0.1.0"
edition = "2021"
description = "baz Spike A: Tauri 2 shell — index lives in Rust, only visible windows cross IPC"

# Standalone workspace: the parent workspace excludes this crate so everything
# else builds without webkit2gtk/gtk system deps.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelf-index = { path = "../crates/shelf-index" }
