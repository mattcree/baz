<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="504" viewBox="0 0 1280 252">
<defs>
  <!-- Contact shadow: a cover stands ON the shelf, it does not float above it.
       Tight, offset down, and darker than a card shadow. -->
  <filter id="contact" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000"
                  flood-opacity="0.55"/>
  </filter>
  <!-- The lamp halo: the accent, spent on the one true thing on screen. -->
  <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="0" stdDeviation="11" flood-color="#E3A14E"
                  flood-opacity="0.45"/>
  </filter>
  <linearGradient id="placeholder" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0" stop-color="#3D3350"/>
    <stop offset="1" stop-color="#1F3A38"/>
  </linearGradient>
  <!-- The shelf scrolls under the bar; it never draws over it. -->
  <clipPath id="shelfarea">
    <rect x="0" y="52" width="1280" height="706"/>
  </clipPath>
</defs>
<rect x="0" y="0" width="1280" height="252" rx="0" fill="#131110" opacity="1.0"/>
<text x="24" y="30" font-family="'IBM Plex Mono','Source Code Pro','JetBrains Mono',monospace" font-size="11" font-weight="400" fill="#726D66" text-anchor="start" letter-spacing="1.4" opacity="1.0">THE NOW-PLAYING BAR</text>
<text x="24" y="50" font-family="'IBM Plex Sans','Source Sans 3','Adwaita Sans','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#A8A29A" text-anchor="start" opacity="1.0">Three zones. Every slot is a fixed width, so nothing in it can move as the music does.</text>
<rect x="0" y="70" width="1280" height="1" rx="0" fill="#EDE3D9" opacity="0.08"/>
<rect x="0" y="71" width="1280" height="101" rx="0" fill="#0D0B0A" opacity="1.0"/>
<text x="24" y="117.5" font-family="'IBM Plex Sans','Source Sans 3','Adwaita Sans','Noto Sans',sans-serif" font-size="13" font-weight="500" fill="#EAE6E0" text-anchor="start" opacity="1.0">Slow Exposure (Reprise)</text>
<text x="24" y="135.5" font-family="'IBM Plex Sans','Source Sans 3','Adwaita Sans','Noto Sans',sans-serif" font-size="12" font-weight="400" fill="#A8A29A" text-anchor="start" opacity="1.0">Delta Nocturne</text>
