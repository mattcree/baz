<rect x="24" y="182" width="1" height="10" rx="0" fill="#EDE3D9" opacity="0.17"/>
<text x="24" y="198" font-family="'IBM Plex Mono','Source Code Pro','JetBrains Mono',monospace" font-size="11" font-weight="400" fill="#726D66" text-anchor="start" opacity="1.0">left: title over artist, clipped never wrapped</text>
<rect x="470" y="182" width="1" height="10" rx="0" fill="#EDE3D9" opacity="0.17"/>
<text x="470" y="198" font-family="'IBM Plex Mono','Source Code Pro','JetBrains Mono',monospace" font-size="11" font-weight="400" fill="#726D66" text-anchor="start" opacity="1.0">centre: transport over groove, fixed column</text>
<rect x="980" y="182" width="1" height="10" rx="0" fill="#EDE3D9" opacity="0.17"/>
<text x="980" y="198" font-family="'IBM Plex Mono','Source Code Pro','JetBrains Mono',monospace" font-size="11" font-weight="400" fill="#726D66" text-anchor="start" opacity="1.0">right: signal note, then volume</text>
<text x="24" y="224" font-family="'IBM Plex Mono','Source Code Pro','JetBrains Mono',monospace" font-size="11" font-weight="400" fill="#4A4743" text-anchor="start" opacity="1.0">Reserved whether or not it has anything to say:  the preview lane (15 px)  ·  the seek row (37 px)  ·  the signal slot (120 px)  ·  the volume block (136 px)</text>
</svg>