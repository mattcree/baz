<text x="1112" y="125.5" font-family="'IBM Plex Mono','Source Code Pro','JetBrains Mono',monospace" font-size="12" font-weight="400" fill="#726D66" text-anchor="end" opacity="1.0">48 → 44.1 kHz</text>
