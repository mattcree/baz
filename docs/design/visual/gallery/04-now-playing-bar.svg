<text x="40.00" y="248.00" font-family="IBM Plex Sans" font-size="18" font-weight="400" fill="#ABA8A1">Nothing in the bar is sized to its content. Every slot is a token wide enough for its worst case, measured in IBM Plex Sans.</text>
<text x="40.00" y="282.00" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#6C6A66">TOKEN</text>
<text x="340.00" y="282.00" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#6C6A66" text-anchor="end">RESERVED</text>
<text x="420.00" y="282.00" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#6C6A66">WORST CASE</text>
<text x="840.00" y="282.00" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#6C6A66" text-anchor="end">MEASURED</text>
<text x="940.00" y="282.00" font-family="IBM Plex Sans" font-size="13" font-weight="500" fill="#6C6A66">NOTE</text>
<line x1="40.00" y1="292.50" x2="2520.00" y2="292.50" stroke="#E8E4DB" stroke-width="1" stroke-opacity="0.07"/>
<text x="40.00" y="314.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">POSITION_W</text>
<text x="340.00" y="314.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">56 px</text>
<text x="420.00" y="314.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">199 / 240</text>
<text x="840.00" y="314.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">53.46 px</text>
<text x="940.00" y="314.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">new — the queue readout the IA adds</text>
<text x="40.00" y="340.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">STAMP_W</text>
<text x="340.00" y="340.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">52 px</text>
<text x="420.00" y="340.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">10:00:00</text>
<text x="840.00" y="340.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">50.21 px</text>
<text x="940.00" y="340.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">unchanged — and the mono face could not hold this at 52</text>
<text x="40.00" y="366.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">SEEK_W</text>
<text x="340.00" y="366.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">260 px</text>
<text x="420.00" y="366.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">—</text>
<text x="840.00" y="366.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">—</text>
<text x="940.00" y="366.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">unchanged — a map of the track, not a gauge</text>
<text x="40.00" y="392.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">SEEK_ROW_W</text>
<text x="340.00" y="392.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">380 px</text>
<text x="420.00" y="392.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">—</text>
<text x="840.00" y="392.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">—</text>
<text x="940.00" y="392.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">SEEK_W + 2 × (STAMP_W + GAP_SM)</text>
<text x="40.00" y="418.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">PREVIEW_H</text>
<text x="340.00" y="418.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">15 px</text>
<text x="420.00" y="418.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">—</text>
<text x="840.00" y="418.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">—</text>
<text x="940.00" y="418.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">the hover lane, reserved whether or not anything hovers</text>
<text x="40.00" y="444.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">SIGNAL_W</text>
<text x="340.00" y="444.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">96 px</text>
<text x="420.00" y="444.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">192 → 176.4 kHz</text>
<text x="840.00" y="444.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">92.38 px</text>
<text x="940.00" y="444.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">was 120</text>
<text x="40.00" y="470.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">LEVEL_W</text>
<text x="340.00" y="470.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">48 px</text>
<text x="420.00" y="470.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">-18.1 dB</text>
<text x="840.00" y="470.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">43.34 px</text>
<text x="940.00" y="470.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">was 62</text>
<text x="40.00" y="496.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">PREVIEW_W</text>
<text x="340.00" y="496.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">48 px</text>
<text x="420.00" y="496.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">0:00:00 + 2 × GAP_XS</text>
<text x="840.00" y="496.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">47.42 px</text>
<text x="940.00" y="496.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">was 58</text>
<text x="40.00" y="522.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">VOLUME_BLOCK_W</text>
<text x="340.00" y="522.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">136 px</text>
<text x="420.00" y="522.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">—</text>
<text x="840.00" y="522.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">—</text>
<text x="940.00" y="522.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">TRANSPORT_HIT + GAP_SM + VOLUME_W</text>
<text x="40.00" y="548.00" font-family="IBM Plex Sans" font-size="15" font-weight="500" fill="#E8E4DB">BAR_H</text>
<text x="340.00" y="548.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1" text-anchor="end">102 px</text>
<text x="420.00" y="548.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#ABA8A1">—</text>
<text x="840.00" y="548.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680" text-anchor="end">—</text>
<text x="940.00" y="548.00" font-family="IBM Plex Sans" font-size="15" font-weight="400" fill="#888680">1 + 12 + 32 + 8 + 15 + 22 + 12 — identical in every state</text>
</svg>
